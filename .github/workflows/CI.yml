name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # FastMultipole v2.3.0 (metadata API) is not in General yet: install it from
      # GitHub. Once General has 2.3.0, set compat FastMultipole = "2.3" and drop this.
      - name: Install FastMultipole v2.3.0 from GitHub
        shell: julia --project=. --color=yes {0}
        run: |
          using Pkg
          Pkg.add(PackageSpec(url="https://github.com/byuflowlab/FastMultipole.jl", rev="v2.3.0"))
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          # FastMultipole v2.3.0 from GitHub until General has it (see the test job)
          Pkg.add(PackageSpec(url="https://github.com/byuflowlab/FastMultipole.jl", rev="v2.3.0"))
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - name: Install FastMultipole v2.3.0 from GitHub
        shell: julia --project=. --color=yes {0}
        run: |
          using Pkg
          Pkg.add(PackageSpec(url="https://github.com/byuflowlab/FastMultipole.jl", rev="v2.3.0"))
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using FLOWVPM
          DocMeta.setdocmeta!(FLOWVPM, :DocTestSetup, :(using FLOWVPM); recursive=true)
          doctest(FLOWVPM)

